[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[tasks]
conda-list = "cd $CONDA_PREFIX && find ."

[feature.local.activation.env]
CC = "clang"
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CTEST_PARALLEL_LEVEL = "4"
CMAKE_CONFIG_TYPE = "Debug"
CMAKE_BUILD_TYPE = "Debug"
# CMAKE_CONFIG_TYPE = "Release"
# CMAKE_BUILD_TYPE = "Release"
# VERBOSE = "1"
# CFLAGS="-fsanitize=address"
# LDFLAGS="-fsanitize=address"
# CFLAGS="-fsanitize=thread"
# LDFLAGS="-fsanitize=thread"
HDF5_CONFIG_ARGS = "-DHDF5_ENABLE_DEBUG_APIS=ON -DHDF5_ENABLE_TRACE=ON -DHDF5_ENABLE_COVERAGE=ON -DHDF5_ENABLE_ZLIB_SUPPORT=ON -DHDF5_ENABLE_SZIP_SUPPORT=ON"

[feature.local.dependencies]
clang = "*"
cmake = "*"
ninja = "*"
zlib = "*"
libaec = "*"  # for szip support

[feature.local.tasks]
config = "cmake -S hdf5 -B $CONDA_PREFIX/build $HDF5_CONFIG_ARGS"
cmake = { cmd = "cmake --build $CONDA_PREFIX/build", depends-on = ["config"] }
ctest = "cd $CONDA_PREFIX/build && ctest --output-on-failure"
cpack = "cd $CONDA_PREFIX/build && cpack -V && mkdir -p $PIXI_PROJECT_ROOT/dist && mv HDF5-2.* $PIXI_PROJECT_ROOT/dist/"
smoke-test = "scripts/smoke-test-local.sh"

# Linter settings must be kept aligned to
# hdf5/.github/workflows/clang-format-fix.yml
[feature.lint.dependencies]
clang-format = "=17"

[feature.lint.tasks]
clang-format = { cwd = "hdf5", cmd = "find . -iname '*.h' -o -iname '*.cpp' -o -iname '*.c' -o -iname '*.hpp' -o -iname '*.java' | grep -v -E '^\\./config|^\\./hl/src/(H5LTanalyze\\.c|H5LTparse\\.[ch])|^\\./src/(H5Epubgen|H5Einit|H5Eterm|H5Edefin|H5version|H5overflow)\\.h' | xargs clang-format -i" }
lint = { depends-on = ["clang-format"] }

[feature.conda-test.tasks]
smoke-test = "scripts/smoke-test-conda.sh"

[feature.pixi-default.dependencies]
hdf5.path = "pixi-packages/hdf5/default"

[feature.pixi-asan.dependencies]
hdf5.path = "pixi-packages/hdf5/asan"

[feature.pixi-tsan.dependencies]
hdf5.path = "pixi-packages/hdf5/tsan"

[feature.h5py.dependencies]
clang = "*"
pytest = "*"
pytest-mpi = "*"
# h5py build dependencies, needed for --no-build-isolation
packaging = "*"
pkgconfig = "*"
setuptools = "*"
cython = "*"

[feature.h5py.activation.env]
CC = "h5cc"

[feature.h5py.tasks]
h5py-install = "python -m pip install h5py/ -vv --no-build-isolation --no-dependencies"
h5py-pytest = "python -m pytest --pyargs h5py -sv"
smoke-test = "scripts/smoke-test-conda.sh && echo && python scripts/smoke-test-h5py.py"

[feature.h5py-default.dependencies]
python.git = "https://github.com/crusaderky/cpython"
python.rev = "tsan"
python.subdirectory = "Tools/pixi-packages/default"
numpy.git = "https://github.com/ngoldbaum/numpy"
numpy.rev = "tsan-ft-pixi"
numpy.subdirectory = "pixi-packages/default"
hdf5.path = "pixi-packages/hdf5/default"

[feature.h5py-default.activation.env]
CFLAGS = "-g"
LDFLAGS = "-g"

[feature.h5py-freethreading.dependencies]
python.git = "https://github.com/crusaderky/cpython"
python.rev = "tsan"
python.subdirectory = "Tools/pixi-packages/freethreading"
numpy.git = "https://github.com/ngoldbaum/numpy"
numpy.rev = "tsan-ft-pixi"
numpy.subdirectory = "pixi-packages/freethreading"
hdf5.path = "pixi-packages/hdf5/default"
pytest-run-parallel = "*"

[feature.h5py-freethreading.activation.env]
CFLAGS = "-g"
LDFLAGS = "-g"

[feature.h5py-asan.dependencies]
python.git = "https://github.com/crusaderky/cpython"
python.rev = "tsan"
python.subdirectory = "Tools/pixi-packages/asan"
numpy.git = "https://github.com/ngoldbaum/numpy"
numpy.rev = "tsan-ft-pixi"
numpy.subdirectory = "pixi-packages/asan"
hdf5.path = "pixi-packages/hdf5/asan"

[feature.h5py-asan.activation.env]
ASAN_OPTIONS = "detect_leaks=0:symbolize=1:strict_init_order=true:allocator_may_return_null=1:use_sigaltstack=0"
CFLAGS = "-g -fsanitize=address"
LDFLAGS = "-g -fsanitize=address"

[feature.h5py-tsan-freethreading.dependencies]
python.git = "https://github.com/crusaderky/cpython"
python.rev = "tsan"
python.subdirectory = "Tools/pixi-packages/tsan-freethreading"
numpy.git = "https://github.com/ngoldbaum/numpy"
numpy.rev = "tsan-ft-pixi"
numpy.subdirectory = "pixi-packages/tsan-freethreading"
hdf5.path = "pixi-packages/hdf5/tsan"
pytest-run-parallel = "*"

[feature.h5py-tsan-freethreading.activation.env]
CFLAGS = "-g -fsanitize=thread"
LDFLAGS = "-g -fsanitize=thread"

[environments]
lint = ["lint"]
local = ["local"]
pixi-default = ["pixi-default", "conda-test"]
pixi-asan = ["pixi-asan", "conda-test"]
pixi-tsan = ["pixi-tsan", "conda-test"]
h5py-default = ["h5py", "h5py-default"]
h5py-freethreading = ["h5py", "h5py-freethreading"]
h5py-asan = ["h5py", "h5py-asan"]
h5py-tsan-freethreading = ["h5py", "h5py-tsan-freethreading"]
