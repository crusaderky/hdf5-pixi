context:
  version: "2.1.0"

package:
  name: hdf5
  version: ${{ version }}

build:
  script:
    file: ../build.sh
    env:
      HDF5_VARIANT: ${{ variant }}

requirements:
  build:
    - clang
    - cmake
    - ninja
    - libaec  # for szip support
    - zlib
  run:
    - libaec
    - zlib
    - if: '"san" in variant'
      then:
        - libcompiler-rt

about:
  homepage: https://www.hdfgroup.org/solutions/hdf5/
  license: BSD-3-Clause
  license_family: BSD
